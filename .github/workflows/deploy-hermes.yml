# Publishes the Edge Function for a change the operator approved from a Hermes proposal
# (R14.14, 2026-09-25): the operator's click on "Aprovar" is the human gate, CI is the
# sandbox (R11.7), and this is the last step. Any other merge to main still deploys by
# hand, on the operator's "pode subir" (R14.8).
#
# Runs after CI passes on main, and only when the merged commit carries `hermes:<uuid>`
# (the implementing session puts it in the PR title). Refuses a change with a migration:
# the running function must never meet a schema it does not know, so those stay manual.
#
# Secrets: SUPABASE_ACCESS_TOKEN (deploy), SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (mark
# the proposal published or failed).
name: Deploy (Hermes)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-turn
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Is this an approved Hermes change?
        id: which
        run: |
          id=$(git log -1 --format=%B | grep -oE 'hermes:[0-9a-f-]{36}' | head -1 | cut -d: -f2 || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # The checks below diff HEAD against its first parent: that is the whole PR only for a
          # merge commit (IMPLEMENTAR.md §5). A rebase or squash of several commits would hide
          # the earlier ones, so it is not published.
          if [ -n "$id" ] && [ "$(git log -1 --format=%P | wc -w)" -lt 2 ]; then
            echo "notmerge=yes" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$id" ] && git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            echo "migration=yes" >> "$GITHUB_OUTPUT"
          fi
          # A loosening the gate diff was told to accept is the operator's to publish: the
          # implementing session can write this file, so the CI check it feeds is not a
          # barrier against that session (security review, 2026-09-29).
          if [ -n "$id" ] && git diff --name-only HEAD~1 HEAD | grep -qx 'tests/gate-loosen-accepted.txt'; then
            echo "loosen=yes" >> "$GITHUB_OUTPUT"
          fi

      # The mark in a commit message is text anyone with push can write. Publish only a
      # proposal the operator's click moved out of 'proposed' — and leave any other row
      # untouched.
      - name: Did the operator approve it?
        id: approved
        if: steps.which.outputs.id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          status=$(curl -fsS "$SUPABASE_URL/rest/v1/hermes_proposals?id=eq.${{ steps.which.outputs.id }}&select=status" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq -r '.[0].status // "none"')
          if [ "$status" != "accepted" ] && [ "$status" != "implementing" ]; then
            echo "hermes:${{ steps.which.outputs.id }} está '$status', não aprovada: nada publicado"
            exit 1
          fi
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: Refuse a change that is not a merge commit
        if: steps.approved.outputs.ok == 'yes' && steps.which.outputs.notmerge == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/hermes_proposals?id=eq.${{ steps.which.outputs.id }}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"status":"failed","result":"a mudança não chegou ao main por merge commit: publicação automática recusada, precisa do operador"}'
          exit 1

      - name: Refuse a gate loosening
        if: steps.approved.outputs.ok == 'yes' && steps.which.outputs.loosen == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/hermes_proposals?id=eq.${{ steps.which.outputs.id }}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"status":"failed","result":"a mudança aceita afrouxar um gate (tests/gate-loosen-accepted.txt): publicação automática recusada, precisa do operador"}'
          exit 1

      - name: Refuse a migration
        if: steps.approved.outputs.ok == 'yes' && steps.which.outputs.migration == 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/hermes_proposals?id=eq.${{ steps.which.outputs.id }}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"status":"failed","result":"a mudança traz migração: publicação automática recusada, precisa do operador"}'
          exit 1

      - uses: supabase/setup-cli@v1
        if: steps.which.outputs.id != ''
        with:
          version: latest

      - name: Deploy the turn function
        if: steps.which.outputs.id != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # verify_jwt stays on (the CLI default), as in every deploy so far.
        run: supabase functions deploy turn --project-ref hbmkgakzrqmdlsvszjeo --use-api

      - name: Mark the proposal
        if: always() && steps.approved.outputs.ok == 'yes' && steps.which.outputs.migration != 'yes' && steps.which.outputs.loosen != 'yes' && steps.which.outputs.notmerge != 'yes'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTCOME: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            # published_at starts the before/after measurement of the proposal's own check
            # (hermes-run.ts); the next production runs overwrite `result` with it.
            body=$(jq -nc --arg r "$RUN" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:"published", published_at:$at, result:("publicada: " + $r)}')
          else
            body=$(jq -nc --arg r "$RUN" '{status:"failed", result:("o deploy falhou, nada mudou em produção: " + $r)}')
          fi
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/hermes_proposals?id=eq.${{ steps.which.outputs.id }}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$body"
