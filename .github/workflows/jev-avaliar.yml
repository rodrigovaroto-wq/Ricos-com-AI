# Measures Jev on the Portuguese gold set (P2.4, operator 2026-10-22) and commits the result to the branch it ran on:
# hermes/jev-aprovadas.json (the only questions a Hermes run asks) and hermes/jev-avaliacao.md (the table). Manual only:
# rerun after changing a question, the pinned model or the gold set. The gold set is synthetic (hermes/jev-ouro.json);
# no customer data is read. Cost: 230 items × 2 calls, a few cents; capped at US$ 0.15 by the script.
#
# Secret: TYPESAFE_API_KEY (repository → Settings → Secrets and variables → Actions).
name: JEV — avaliar em português

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Measure Jev on the gold set
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm jev:avaliar

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes/jev-aprovadas.json hermes/jev-avaliacao.md
          git diff --cached --quiet || git commit -m "jev: avaliação no conjunto de ouro (P2.4)"
          git push
