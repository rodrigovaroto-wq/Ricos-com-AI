# Hermes, the offline supervisor (R5.7, R6.2, R11.2, R11.6), on the only host this project
# already trusts to run code against it: CI is the sandbox (R11.7).
#
# Daily, it asks `hermes_backlog` whether 50 leads arrived since the last production run
# (R6.2). If so, it runs Hermes over the last 50 conversations — PII masked before anything
# leaves for the model, standard Muse only (never -contributor on real customers) — writes
# the run and the valid proposals to Supabase with status 'proposed', and opens a pull
# request with the proposals document — excerpts and quoted text replaced, since git never
# expires (LGPD, R6.3); the originals stay in hermes_proposals for 90 days. The loop
# closes on a person: merging the PR, or opening a registry entry from it, is the
# operator's call. Nothing here deploys.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, META_API_KEY
name: Hermes

on:
  schedule:
    - cron: "47 11 * * *" # 08:47 in São Paulo
  workflow_dispatch:
    inputs:
      force:
        description: "Rodar mesmo sem 50 leads novos"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hermes
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No token left in .git/config: Hermes runs inside this checkout with a file toolset,
      # and reads customer text that may carry instructions. create-pull-request brings its
      # own token for the one push this job makes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6

      # Pinned: a supervisor that reads customer conversations does not float on main.
      - name: Install Hermes Agent
        run: |
          uv python install 3.14
          uv tool install --python 3.14 "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@ac4181fdfaa4fa3b0682ea7b592c7a3ee6465e62"

      - name: Run Hermes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          HERMES_BIN: hermes
          # Optional ceiling per run, in US$ (repository → Settings → Variables). Unset = none.
          HERMES_MAX_USD: ${{ vars.HERMES_MAX_USD }}
        run: pnpm hermes --source=supabase --write-db ${{ inputs.force && ' ' || '--only-if-due' }}

      - name: Open the proposals for the operator
        uses: peter-evans/create-pull-request@v7
        with:
          branch: hermes/propostas
          commit-message: "docs(hermes): propostas do supervisor"
          title: "Hermes: propostas para decidir"
          body: |
            Propostas do Hermes sobre as últimas conversas reais — cada uma validada (trecho
            copiado da conversa, nada da lista do que não se faz) e testada contra os gates de hoje.

            **Nada aqui foi aplicado.** A decisão é pelo link que chega por e-mail para cada
            proposta (R14.14); este PR só guarda o documento da rodada.
          add-paths: docs/agente-ia/08-mudancas/propostas/*
