# The four canonical commands, plus the one that needs a different runtime.
#
# Until now "green" meant somebody remembered to run vitest locally. That is how the
# Edge Function's copies drifted from the repo in both directions, and how `pnpm lint`
# stayed broken long enough for nobody to notice it had never run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate verdict diff needs origin/main to find the base commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Includes function-drift.test.ts (the mirrored copies still agree), the 794-case
      # chain range, and the 300 complete conversations. The last one is the only thing
      # that exercises the fourth turn: a gate proves a sentence is refused, a
      # conversation proves the size she gave in turn two survives to turn five.
      - run: pnpm test

      # Every gate fix here opened a new hole that only a hand comparison found
      # ("before: block, after: pass"). This does the comparison against the base
      # branch over every sentence the tests and reviewers ever wrote, and fails on a
      # loosening nobody accepted in tests/gate-loosen-accepted.txt.
      - run: pnpm dev:gates --fail-on-loosen

      # The Edge Function is Deno, and `tsc` does not cover it (`include: ["src",
      # "tests"]`). Without this step the file that actually runs in production is the
      # only one nothing typechecks.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm typecheck:function
